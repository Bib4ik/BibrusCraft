        <a href="../api/register.html" class="btn btn-register">Регистрация</a>

</div>

<!-- NAVBAR -->
<nav class="navbar">
    <div class="nav-inner">
        <a href="../index.html" class="logo-section">
            <div class="logo-hexes">
                <svg class="hex-big" width="28" height="28" viewBox="0 0 28 28" fill="none">
                    <polygon points="14,2 24,8 24,20 14,26 4,20 4,8" stroke="#00c8f8" stroke-width="1.2" fill="rgba(0,200,248,0.07)"/>
                </svg>
                <svg class="hex-small" width="16" height="16" viewBox="0 0 16 16" fill="none">
                    <polygon points="8,1 14,4.5 14,11.5 8,15 2,11.5 2,4.5" stroke="#00c8f8" stroke-width="1" fill="rgba(0,200,248,0.12)"/>
                </svg>
            </div>
            <div>
                <div class="logo-text">OldCraft</div>
                <span class="logo-sub">Gaming Network</span>
            </div>
        </a>

        <div class="nav-links">
            <a href="#" class="nav-link active">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
                Главная
            </a>
            <a href="#" class="nav-link">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
                Наши сервера
            </a>
            <a href="#" class="nav-link">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
                Помощь
            </a>
            <a href="#" class="nav-link">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M4.93 4.93a10 10 0 0 0 0 14.14"/></svg>
                Донат
            </a>
            <a href="#" class="nav-link">

<!-- REGISTER PAGE -->
<div class="reg-page">
    <div class="reg-card">
        <div class="reg-header">
            <div class="reg-header-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                    <circle cx="12" cy="7" r="4"/>
                </svg>
            </div>
            <div>
                <div class="reg-label">// Создание аккаунта</div>
                <div class="reg-title">Регистрация</div>
            </div>
        </div>

        <div class="reg-body">
            <div class="reg-row">
                <div class="reg-field">
                    <label>Имя</label>
                    <div class="reg-input-wrap">
            <span class="reg-input-icon">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
              </svg>
            </span>
                        <input class="reg-input" type="text" placeholder="Ваше имя">
                    </div>
                </div>
                <div class="reg-field">
                    <label>Фамилия</label>
                    <div class="reg-input-wrap">
            <span class="reg-input-icon">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
              </svg>
            </span>
                        <input class="reg-input" type="text" placeholder="Ваша фамилия">
                    </div>
                </div>
            </div>

            <div class="reg-field">
                <label>Никнейм</label>
                <div class="reg-input-wrap">
          <span class="reg-input-icon">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/>
            </svg>
          </span>
                    <input class="reg-input" type="text" placeholder="Игровой никнейм">
                </div>
            </div>

            <div class="reg-field">
                <label>Email</label>
                <div class="reg-input-wrap">
          <span class="reg-input-icon">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
              <polyline points="22,6 12,13 2,6"/>
            </svg>
          </span>
                    <input class="reg-input" type="email" placeholder="example@mail.com">
                </div>
            </div>

            <div class="reg-field">
                <label>Пароль</label>
                <div class="reg-input-wrap">
          <span class="reg-input-icon">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
          </span>
                    <input class="reg-input" type="password" placeholder="Минимум 8 символов">
                </div>
            </div>

            <div class="reg-field">
                <label>Подтверждение пароля</label>
                <div class="reg-input-wrap">
          <span class="reg-input-icon">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
            </svg>
          </span>
                    <input class="reg-input" type="password" placeholder="Повторите пароль">
                </div>
            </div>

            <label class="reg-check">
                <input type="checkbox">
                <div class="reg-check-box">
                    <svg width="9" height="7" viewBox="0 0 9 7" fill="none">
                        <path d="M1 3.5L3 5.5L8 1" stroke="#00c8f8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>
                <span class="reg-check-text">Я принимаю <a href="#">Условия использования</a> и <a href="#">Политику конфиденциальности</a></span>
            </label>

            <button class="reg-submit">Создать аккаунт</button>

            <div class="reg-divider">
                <div class="reg-divider-line"></div>
                <span class="reg-divider-text">или</span>
                <div class="reg-divider-line"></div>
            </div>

            <div class="reg-footer-text">
                Уже есть аккаунт? <a href="#">Войти</a>
            </div>
        </div>
    </div>
</div>


</body>
</html>
